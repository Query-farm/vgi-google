# Copyright 2026 Query Farm LLC - https://query.farm
#
# Unit tests (pytest), lint, and the sqllogictest extension suite
# (test/sql/*.test) run against the vgi-google worker through the real signed
# `vgi` DuckDB community extension via a prebuilt standalone `haybarn-unittest`.
# The SQL E2E runs the worker with VGI_GOOGLE_MOCK=1 against canned discovery
# docs — no keys, no cost, no live egress. See ci/README.md for the design.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow the docker-publish.yml and release.yml callers to gate on this CI.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run --no-sync pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy vgi_google google_worker.py serve.py

      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_google google_worker.py serve.py

  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker (from the lockfile, with the http extra)
        run: uv sync --frozen --python 3.14 --extra http

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Run the worker from the synced project venv (deps from the lockfile),
          # NOT `uv run google_worker.py`: the PEP-723 script env caches a stale
          # SDK and would emit the old catalog schema, a false mismatch.
          location: ".venv/bin/python google_worker.py"
          fail-on: info
          # Static (metadata) gate only. Five of the seven table functions —
          # google_sheet / google_drive / google_calendar / google_youtube /
          # google_call — and all thirteen google.workspace.* functions (users,
          # groups, group_members, org_units, domains, roles, role_assignments,
          # chromeos_devices, mobile_devices, activities, usage_reports, alerts,
          # group_settings: a Workspace-admin `google_service_account` secret
          # with domain-wide delegation `subject`) require a live Google
          # credential (a `google_service_account` or `google_api_key` secret) before they can
          # scan, so the VGI9xx execution rules (notably VGI911 scan-responds)
          # cannot run here without a real secret. The worker's REAL execution is
          # covered by the `integration` job below, which drives every transport
          # against the worker with VGI_GOOGLE_MOCK=1 and canned discovery docs.
          # The two credential-free discovery functions (google_apis /
          # google_methods) and the google_functions view still resolve live, but
          # execution is all-or-nothing, so it is disabled for the whole step.
          execute: "false"

  # SQL tests: test/sql/*.test through the published haybarn-unittest with the
  # signed community `vgi` extension, over every transport (ci/run-integration.sh,
  # adapted from the vgi-starters template). `launch` starts the worker once on a
  # unix socket and pools connections.
  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    env:
      UV_PYTHON: "3.14"
      HAYBARN_VERSION: "2.0.1rc3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build the worker
        run: uv sync --locked --all-extras

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          export WORKER="$PWD/ci/worker"
          export HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest"
          TRANSPORT=${{ matrix.transport }} PYTHON="$PWD/.venv/bin/python" ci/run-integration.sh
