# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; these canonical solutions and
# grading options stay in the repo and are merged by task name.
tasks:
  - name: discover_sheets_api
    reference_sql: "SELECT name, version, title FROM google.main.google_apis() WHERE name = 'sheets';"
  - name: sheets_preferred_version
    reference_sql: "SELECT version FROM google.main.google_apis() WHERE name = 'sheets' AND preferred;"
  - name: drive_files_list_verb
    reference_sql: "SELECT method, http_method FROM google.main.google_methods('drive', 'v3') WHERE method = 'files.list';"
  - name: calendar_api_reachable
    reference_sql: "SELECT name, version FROM google.main.google_apis() WHERE name = 'calendar';"
  - name: browse_api_directory_for_calendar
    reference_sql: "SELECT name, version FROM google.main.google_api_directory WHERE name = 'calendar';"
  - name: sheets_values_get_verb
    reference_sql: "SELECT http_method FROM google.main.google_methods('sheets', 'v4') WHERE method = 'spreadsheets.values.get';"
  - name: sheets_preferred_post_methods
    reference_sql: "SELECT method FROM google.main.google_methods('sheets', 'v4') WHERE http_method = 'POST' ORDER BY method;"
  - name: drive_methods_kept_in_v3_by_verb
    reference_sql: "SELECT v3.http_method, count(*) AS n FROM google.main.google_methods('drive', 'v3') AS v3 SEMI JOIN google.main.google_methods('drive', 'v2') AS v2 ON v2.method = v3.method GROUP BY v3.http_method ORDER BY v3.http_method;"
  - name: sheet_read_range
    reference_sql: "SELECT row_number FROM google.main.google_sheet('1AbC', 'Sheet1!A1:Z', header := true) WHERE row_number <= 50 ORDER BY row_number;"
  - name: drive_list_pdfs
    reference_sql: "SELECT id, name FROM google.main.google_drive(query := \"mimeType='application/pdf'\", count := 25) ORDER BY name;"
  - name: calendar_list_events
    reference_sql: "SELECT id, summary, start_time FROM google.main.google_calendar(calendar_id := 'primary', count := 20) ORDER BY start_time;"
  - name: youtube_search_by_views
    reference_sql: "SELECT title, view_count FROM google.main.google_youtube('duckdb', count := 10, order_by := 'viewCount') ORDER BY view_count DESC;"
  - name: call_gmail_labels
    reference_sql: "SELECT result ->> '$.name' AS label FROM google.main.google_call('gmail', 'v1', 'users.labels.list', '{\"userId\":\"me\"}') WHERE result ->> '$.type' = 'user' ORDER BY label;"
  - name: workspace_admins_without_2sv
    reference_sql: "SELECT primary_email FROM google.workspace.users() WHERE is_admin AND NOT is_enrolled_in_2sv ORDER BY primary_email;"
  - name: workspace_largest_groups
    reference_sql: "SELECT email, direct_members_count FROM google.workspace.groups() ORDER BY direct_members_count DESC, email LIMIT 5;"
  - name: workspace_group_owners
    reference_sql: "SELECT email FROM google.workspace.group_members('eng@example.com') WHERE role = 'OWNER' ORDER BY email;"
  - name: workspace_org_unit_tree
    reference_sql: "SELECT org_unit_path FROM google.workspace.org_units() ORDER BY org_unit_path;"
  - name: workspace_unverified_domains
    reference_sql: "SELECT domain_name FROM google.workspace.domains() WHERE NOT verified ORDER BY domain_name;"
  - name: workspace_custom_roles
    reference_sql: "SELECT role_name FROM google.workspace.roles() WHERE NOT is_system_role ORDER BY role_name;"
  - name: workspace_role_holders
    reference_sql: "SELECT r.role_name, u.primary_email FROM google.workspace.role_assignments() AS a JOIN google.workspace.roles() AS r USING (role_id) LEFT JOIN google.workspace.users() AS u ON u.id = a.assigned_to ORDER BY r.role_name, u.primary_email;"
  - name: workspace_chromeos_expired
    reference_sql: "SELECT serial_number FROM google.workspace.chromeos_devices() WHERE auto_update_through < TIMESTAMPTZ '2026-11-15 00:00:00+00' ORDER BY serial_number;"
  - name: workspace_mobile_stale
    reference_sql: "SELECT resource_id FROM google.workspace.mobile_devices() WHERE last_sync < TIMESTAMPTZ '2026-10-01 00:00:00+00' ORDER BY resource_id;"
  - name: workspace_failed_logins_week
    reference_sql: "SELECT time, actor_email FROM google.workspace.activities('login') WHERE event_name = 'login_failure' AND time >= TIMESTAMPTZ '2026-11-01 00:00:00+00' AND time < TIMESTAMPTZ '2026-11-08 00:00:00+00' ORDER BY time;"
  - name: workspace_user_count_on_day
    reference_sql: "SELECT int_value FROM google.workspace.usage_reports() WHERE date = DATE '2026-11-10' AND parameter = 'accounts:num_users';"
  - name: workspace_high_alerts
    reference_sql: "SELECT alert_id, type FROM google.workspace.alerts() WHERE create_time >= TIMESTAMPTZ '2026-11-01 00:00:00+00' AND severity = 'HIGH' ORDER BY alert_id;"
  - name: workspace_group_allows_outsiders
    reference_sql: "SELECT who_can_join, allow_external_members FROM google.workspace.group_settings('eng@example.com');"
